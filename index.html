    <script>
      (function() {
        try {
          var stored = localStorage.getItem('foodproduction-module2-storage');
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && parsed.state && parsed.state.theme === 'dark') {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
    <title>खाद्य उत्पादन · मॉड्यूल 2 — उन्नत स्किल लैब</title>
